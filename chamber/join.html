<main>
    <h1></h1>

            <form method="GET" action="thanks.html" class="designOne">
                <label>First Name <input type="text" name="first" required autocomplete="given-name" title="Your First Name"></label>
                <label>Last Name <input type="text" name="last" required autocomplete="family-name" title="Your Last Name"></label>
                <label>Organization Title<input type="org" name="organization"  autocomplete="organization-title" title="a title organization" ></label>
                <label>Cell Phone <input type="tel" name="phone"  autocomplete="tel" title="A Phone Number with dashes" placeholder="987-555-1234" ></label>
                <label>Email Adress<input type="email" name="email" required placeholder="john89@gmail.com"  title="Your Email" autocomplete="email"></label>
                <label>Business/organization's name<input type="" name="" required title="" autocomplete=""></label>

                <h3>Membership Level</h3>
                <label>Membership
                <select name="membership" required>
                <option value="">None</option>
                <option value="np">NP Membership</option>
                <option value="bronze">Bronze Membership</option>
                <option value="silver">Silver Membership</option>                
                <option value="gold">Gold Membership</option>
                </label>

                
                 <label>Description</label>
                    <textarea type="" title="" name=""></textarea>
                    

                <h3>Timestamp</h3>
                <label>Date <input type="date" name="date" required></label>

                

        <input type="submit" value="Be a New Member">
    </form>
